<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <pattern id="hazard" width="64" height="64" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="64" height="64" fill="#F7D308" />
      <rect width="30" height="64" fill="#0B0B0D" />
    </pattern>
  </defs>

  <rect width="1600" height="900" fill="#0B0B0D" />
  <rect y="0" width="1600" height="56" fill="url(#hazard)" />
  <rect y="844" width="1600" height="56" fill="url(#hazard)" />

  <g font-family="DejaVu Sans, Liberation Sans, Noto Sans, Helvetica, Arial, sans-serif">
    <!-- warning triangle -->
    <polygon points="250,142 372,392 128,392" fill="#F7D308" />
    <polygon points="250,182 340,370 160,370" fill="#0B0B0D" />
    <rect x="241" y="228" width="18" height="84" fill="#F7D308" />
    <rect x="241" y="330" width="18" height="18" fill="#F7D308" />

    <!-- headline -->
    <text x="430" y="222" font-size="56" font-weight="700" fill="#F5F5F7" letter-spacing="2">THE AUTHOR ACCEPTS</text>
    <text x="426" y="336" font-size="106" font-weight="900" fill="#F7D308" letter-spacing="-2">NO LIABILITY.</text>
    <text x="430" y="404" font-size="36" font-weight="700" fill="#F5F5F7">IF YOUR LAPTOP BREAKS, YOUR CABLE MELTS,</text>
    <text x="430" y="448" font-size="36" font-weight="700" fill="#F5F5F7">OR YOUR HOUSE BURNS DOWN, THAT IS ON YOU.</text>

    <line x1="140" y1="490" x2="1460" y2="490" stroke="#F5F5F7" stroke-opacity="0.16" stroke-width="2" />

    <text x="140" y="536" font-size="26" font-weight="700" fill="#FF9F0A" letter-spacing="3">…OR IF ANY OF THE FOLLOWING HAPPENS:</text>

    <!-- catastrophe list -->
    <g font-size="30" fill="#F5F5F7">
      <text x="140" y="584"><tspan fill="#FF4B3E">•</tspan>  your laptop refuses to boot</text>
      <text x="140" y="628"><tspan fill="#FF4B3E">•</tspan>  your cable becomes a fuse</text>
      <text x="140" y="672"><tspan fill="#FF4B3E">•</tspan>  your breaker panel taps out</text>
      <text x="140" y="716"><tspan fill="#FF4B3E">•</tspan>  your desk develops a tan line</text>
      <text x="860" y="584"><tspan fill="#FF4B3E">•</tspan>  your warranty voids itself</text>
      <text x="860" y="628"><tspan fill="#FF4B3E">•</tspan>  your charger gains consciousness</text>
      <text x="860" y="672"><tspan fill="#FF4B3E">•</tspan>  your cat becomes electromagnetic</text>
      <text x="860" y="716"><tspan fill="#FF4B3E">•</tspan>  your smart home gets smarter</text>
    </g>

    <rect x="0" y="744" width="1600" height="66" fill="#F7D308" />
    <text x="800" y="788" text-anchor="middle" font-size="31" font-weight="900" fill="#0B0B0D" letter-spacing="1">FLASH AT YOUR OWN RISK · NO WARRANTY · NO REFUNDS · NO SUPPORT</text>
    <text x="800" y="832" text-anchor="middle" font-size="19" fill="#8A8A93">UltraCable 3.8 is an art project. Not affiliated with Apple Inc. MagSafe is a trademark of Apple Inc.</text>
  </g>
</svg>
